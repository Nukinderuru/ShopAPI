services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shoppass
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: authpass
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      AUTH_GRPC_PORT: 9090
      AUTH_DATABASE_JDBC_URL: jdbc:postgresql://auth-postgres:5432/auth
      AUTH_DATABASE_USERNAME: auth_user
      AUTH_DATABASE_PASSWORD: authpass
      AUTH_DATABASE_MAXIMUM_POOL_SIZE: 10
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_TTL_SECONDS: 86400
    expose:
      - 9090

  app:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    container_name: shop-app
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8080

  app-read-1:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    container_name: shop-app-read-1
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: 8081
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop?options=-c%20default_transaction_read_only%3Don
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8081

  app-read-2:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    container_name: shop-app-read-2
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: 8082
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop?options=-c%20default_transaction_read_only%3Don
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8082

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    container_name: shop-nginx
    depends_on:
      - app
      - app-read-1
      - app-read-2
      - auth-service
      - pgadmin
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/static:/usr/share/nginx/html:ro

  pgadmin:
    image: docker.io/dpage/pgadmin4:9.14
    container_name: shop-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  auth-postgres-data:
  pgadmin-data:
