services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shoppass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
    ports:
      - "8080:8080"

volumes:
  postgres-data:
