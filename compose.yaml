services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shoppass
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: authpass
    ports:
      - "5436:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      AUTH_GRPC_PORT: 9090
      AUTH_DATABASE_JDBC_URL: jdbc:postgresql://auth-postgres:5432/auth
      AUTH_DATABASE_USERNAME: auth_user
      AUTH_DATABASE_PASSWORD: authpass
      AUTH_DATABASE_MAXIMUM_POOL_SIZE: 10
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_TTL_SECONDS: 86400
    expose:
      - 9090

  app:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      RUN_DATABASE_MIGRATIONS: "true"
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8080
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  app-read-1:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      app:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop?options=-c%20default_transaction_read_only%3Don
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      RUN_DATABASE_MIGRATIONS: "false"
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8081

  app-read-2:
    build:
      context: .
      dockerfile: shop-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      app:
        condition: service_healthy
    environment:
      PORT: 8082
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop?options=-c%20default_transaction_read_only%3Don
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 10
      RUN_DATABASE_MIGRATIONS: "false"
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9090
    expose:
      - 8082

  product-event-generator:
    build:
      context: .
      dockerfile: product-event-generator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/shop
      DATABASE_USERNAME: shop_user
      DATABASE_PASSWORD: shoppass
      DATABASE_MAXIMUM_POOL_SIZE: 5
      PRODUCT_EVENT_INTERVAL_SECONDS: 5
      PRODUCT_EVENT_GATEWAY_URL: http://app:8080/api/v1/internal/product-events
      PRODUCT_EVENT_HTTP_TIMEOUT_SECONDS: 5

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
      app-read-1:
        condition: service_started
      app-read-2:
        condition: service_started
      auth-service:
        condition: service_started
      pgadmin:
        condition: service_started
    ports:
      - "8082:80"
      - "8444:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/static:/usr/share/nginx/html:ro

  pgadmin:
    image: docker.io/dpage/pgadmin4:9.14
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres-data:
  auth-postgres-data:
  pgadmin-data:
