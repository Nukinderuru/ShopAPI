ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }

  application {
    modules = [ com.nukinderuru.ApplicationKt.module ]
  }
}

database {
  driverClassName = "org.postgresql.Driver"
  jdbcUrl = "jdbc:postgresql://localhost:5434/shop"
  jdbcUrl = ${?DATABASE_JDBC_URL}
  username = "shop_user"
  username = ${?DATABASE_USERNAME}
  password = "shoppass"
  password = ${?DATABASE_PASSWORD}
  maximumPoolSize = 10
  maximumPoolSize = ${?DATABASE_MAXIMUM_POOL_SIZE}
  runMigrations = false
  runMigrations = ${?RUN_DATABASE_MIGRATIONS}
}

auth {
  host = "localhost"
  host = ${?AUTH_SERVICE_HOST}
  host = ${?AUTH_GRPC_HOST}
  port = 9090
  port = ${?AUTH_SERVICE_PORT}
  port = ${?AUTH_GRPC_PORT}
}

rabbitmq {
  enabled = false
  enabled = ${?AMQP_CONSUMER_ENABLED}
  host = "localhost"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "/"
  virtualHost = ${?RABBITMQ_VHOST}
  exchange = "product.events"
  exchange = ${?RABBITMQ_EXCHANGE}
  routingKey = "product.changed"
  routingKey = ${?RABBITMQ_ROUTING_KEY}
  mainQueue = "shop-api.product-events"
  retryExchange = "product.events.retry"
  deadLetterExchange = "product.events.dlx"
  deadLetterQueue = "shop-api.product-events.dlq"
  confirmTimeoutMillis = 5000
  confirmTimeoutMillis = ${?RABBITMQ_CONFIRM_TIMEOUT_MILLIS}
}
